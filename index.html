    <!-- Loader is inlined so it paints before three.js is even parsed. -->
    <style>
      :root { --rain: #00d93f; --bg: #000804; }
      html, body { margin: 0; padding: 0; background: var(--bg); }
      #loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; gap: 14px;
        align-items: center; justify-content: center;
        background: var(--bg); color: var(--rain);
        font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace;
        font-size: 14px; letter-spacing: 0.18em;
        text-shadow: 0 0 6px rgba(0,217,63,.45), 0 0 18px rgba(0,217,63,.2);
        transition: opacity .45s ease;
        pointer-events: none;
      }
      #loader.done { opacity: 0; }
      #loader .ascii { display: flex; font-size: 17px; font-weight: 700; }
      #loader .ascii i { font-style: normal; width: 11px; text-align: center; }
      #loader .ascii i::after { content: '-'; animation: asciiwave .72s steps(1) infinite; }
      @keyframes asciiwave {
        0%   { content: '-'; }  12% { content: '='; }
        25%  { content: '\2261'; } 37% { content: '\2263'; }
        50%  { content: '\2588'; } 62% { content: '\2263'; }
        75%  { content: '\2261'; } 87% { content: '='; }
        100% { content: '-'; }
      }
      #loader .msg { opacity: .55; font-size: 11px; }
      @media (prefers-reduced-motion: reduce) {
        #loader .ascii i::after { animation: none; content: '\2588'; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="ascii" aria-hidden="true"></div>
      <div class="pct" id="loader-pct">[          ] 00%</div>
      <div class="msg">INITIALISING TRIDIPEDIA</div>
    </div>
    <noscript>
      <div style="position:relative;z-index:100;padding:28px 20px;color:#00d93f;background:#000804;font:14px/1.6 ui-monospace,monospace;max-width:74ch;margin:0 auto">
        <h1 style="font-size:17px;letter-spacing:.12em;color:#b6ffd0">Tridipedia: Journey of a Developer</h1>
        <p>Tridibesh Nag, Technical Lead at Next Zen Minds. Backend and AI systems engineer based in India.</p>
        <p>This site renders an interactive 3D experience with JavaScript. Enable JavaScript for the full version; all content is also available in its built-in text mode.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script>
      // Build the wave bars with staggered delays, no framework needed.
      (function () {
        var w = document.querySelector('#loader .ascii');
        for (var i = 0; i < 12; i++) {
          var el = document.createElement('i');
          el.style.animationDelay = (i * -0.06) + 's';
          w.appendChild(el);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
